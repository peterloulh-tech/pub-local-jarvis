name: 构建 Windows 安装包

on:
  workflow_dispatch:
  push:
    branches:
      - ci-windows-installer

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: 构建 Windows 安装包
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      CUDA_VERSION: 13.1.1
      CUDA_PATH: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.1
      CUDA_CRT_VERSION: 13.1.115
      CUDA_CRT_SHA256: 70ceb7b7c5ef29fab700000fd0b127b7ffd4c8a78eac413ed2c39eb94437580c

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备构建临时目录
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildLogDir = Join-Path $env:RUNNER_TEMP "jarvis-build-logs"
          $cudaInstallerPath = Join-Path $env:RUNNER_TEMP "cuda_$($env:CUDA_VERSION)_windows_network.exe"
          New-Item -ItemType Directory -Path $buildLogDir -Force | Out-Null
          "BUILD_LOG_DIR=$buildLogDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_INSTALLER_PATH=$cudaInstallerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $artifactBranch = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
          "ARTIFACT_BRANCH=$artifactBranch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 配置 Node.js 22.22.3
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 配置 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 定位并初始化 Visual Studio 2022
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $originalPSModulePath = $env:PSModulePath
          if ([string]::IsNullOrWhiteSpace($originalPSModulePath)) {
            throw "PSModulePath was empty before Visual Studio environment initialization."
          }
          $windowsPowerShellModuleRoot = Join-Path `
            ([Environment]::GetFolderPath([Environment+SpecialFolder]::System)) `
            "WindowsPowerShell\v1.0\Modules"
          if (-not (Test-Path -LiteralPath $windowsPowerShellModuleRoot -PathType Container)) {
            throw "Windows PowerShell system module directory was not found: $windowsPowerShellModuleRoot"
          }
          $modulePaths = @($originalPSModulePath.Split(';', [StringSplitOptions]::RemoveEmptyEntries))
          if (-not ($modulePaths | Where-Object { $_.TrimEnd('\') -ieq $windowsPowerShellModuleRoot.TrimEnd('\') })) {
            $modulePaths += $windowsPowerShellModuleRoot
          }
          $effectivePSModulePath = $modulePaths -join ';'
          $env:PSModulePath = $effectivePSModulePath
          $windowsPowerShellModulePath = $env:WinPSModulePath
          if ([string]::IsNullOrWhiteSpace($windowsPowerShellModulePath)) {
            $windowsPowerShellModulePath = (& powershell.exe -NoLogo -NoProfile -Command '$env:PSModulePath').Trim()
          }
          if ([string]::IsNullOrWhiteSpace($windowsPowerShellModulePath)) {
            throw "The Windows PowerShell module path could not be determined."
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found: $vswhere"
          }

          $installationPath = (& $vswhere -latest -products * -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1).Trim()
          if (-not $installationPath) {
            throw "Visual Studio 2022 with the x64 C++ toolchain was not found."
          }

          $devCommand = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path -LiteralPath $devCommand -PathType Leaf)) {
            throw "VsDevCmd.bat was not found: $devCommand"
          }

          $env:PSModulePath = $effectivePSModulePath
          "WINDOWS_POWERSHELL_MODULE_PATH=$windowsPowerShellModulePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "Visual Studio installation: $installationPath" |
            Tee-Object -FilePath (Join-Path $env:BUILD_LOG_DIR "tool-versions.log")
          # Validate MSVC inside an isolated developer shell. Do not persist the
          # VsDevCmd environment: prepare-release.ps1 initializes it once for the
          # CUDA/Ninja build, and initializing an already-expanded environment can
          # exceed cmd.exe's environment-line limit.
          & cmd.exe /d /s /c "`"$devCommand`" -no_logo -arch=x64 -host_arch=x64 >nul && cl.exe 2>&1" |
            Tee-Object -FilePath (Join-Path $env:BUILD_LOG_DIR "tool-versions.log") -Append
          if ($LASTEXITCODE -ne 0) {
            throw "cl.exe version check failed with exit code $LASTEXITCODE."
          }

      - name: 输出 Node、Python、CMake 和 Ninja 版本
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:BUILD_LOG_DIR "tool-versions.log"
          & node --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "node --version failed." }
          & npm --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "npm --version failed." }
          & python --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "python --version failed." }
          & python -m pip --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "pip --version failed." }
          & cmake --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "cmake --version failed." }
          & ninja --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "ninja --version failed." }

      - name: 安装 CUDA Toolkit 13.1.1 构建组件
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $installer = $env:CUDA_INSTALLER_PATH
          $installerUrl = "https://developer.download.nvidia.com/compute/cuda/13.1.1/network_installers/cuda_13.1.1_windows_network.exe"
          $installLog = Join-Path $env:BUILD_LOG_DIR "cuda-install.log"

          "Downloading CUDA network installer from $installerUrl" |
            Tee-Object -FilePath $installLog
          Invoke-WebRequest -Uri $installerUrl -OutFile $installer -UseBasicParsing

          $signature = Get-AuthenticodeSignature -FilePath $installer
          "Installer signature status: $($signature.Status)" |
            Tee-Object -FilePath $installLog -Append
          "Installer signer: $($signature.SignerCertificate.Subject)" |
            Tee-Object -FilePath $installLog -Append
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              $signature.SignerCertificate.Subject -notmatch 'NVIDIA') {
            throw "The CUDA installer does not have a valid NVIDIA Authenticode signature."
          }

          # These are the components used by the existing CMake/Ninja CUDA build:
          # nvcc, CUDA runtime/headers, cuBLAS runtime/development files, and
          # Thrust/CUB headers. Display.Driver is deliberately not requested.
          $arguments = @(
            "-s",
            "-n",
            "nvcc_13.1",
            "cudart_13.1",
            "cublas_13.1",
            "cublas_dev_13.1",
            "thrust_13.1"
          )
          "Installing components: $($arguments[2..($arguments.Count - 1)] -join ', ')" |
            Tee-Object -FilePath $installLog -Append
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          "CUDA installer exit code: $($process.ExitCode)" |
            Tee-Object -FilePath $installLog -Append
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "CUDA installer failed with exit code $($process.ExitCode)."
          }

          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.1"
          $cudaBin = Join-Path $cudaRoot "bin"
          # CUDA 13.1 publishes the compiler-runtime headers as a separate,
          # checksum-addressed redistributable. The selective network-installer
          # components do not provide include\crt on the hosted runner.
          $cudaCrtArchive = Join-Path $env:RUNNER_TEMP `
            "cuda_crt-windows-x86_64-$($env:CUDA_CRT_VERSION)-archive.zip"
          $cudaCrtExtractRoot = Join-Path $env:RUNNER_TEMP "jarvis-cuda-crt"
          $cudaCrtUrl = "https://developer.download.nvidia.com/compute/cuda/redist/cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-$($env:CUDA_CRT_VERSION)-archive.zip"
          "Downloading CUDA CRT headers from $cudaCrtUrl" |
            Tee-Object -FilePath $installLog -Append
          Invoke-WebRequest -Uri $cudaCrtUrl -OutFile $cudaCrtArchive -UseBasicParsing
          $cudaCrtHash = (Get-FileHash -LiteralPath $cudaCrtArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          "CUDA CRT archive SHA-256: $cudaCrtHash" |
            Tee-Object -FilePath $installLog -Append
          if ($cudaCrtHash -ne $env:CUDA_CRT_SHA256) {
            throw "CUDA CRT archive SHA-256 did not match the pinned value."
          }
          if (Test-Path -LiteralPath $cudaCrtExtractRoot) {
            Remove-Item -LiteralPath $cudaCrtExtractRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $cudaCrtArchive -DestinationPath $cudaCrtExtractRoot
          $cudaCrtSource = Join-Path $cudaCrtExtractRoot `
            "cuda_crt-windows-x86_64-$($env:CUDA_CRT_VERSION)-archive\include\crt"
          if (-not (Test-Path -LiteralPath (Join-Path $cudaCrtSource "host_config.h") -PathType Leaf)) {
            throw "The pinned CUDA CRT archive did not contain include\crt\host_config.h."
          }
          $cudaCrtDestination = Join-Path $cudaRoot "include\crt"
          New-Item -ItemType Directory -Path $cudaCrtDestination -Force | Out-Null
          Get-ChildItem -LiteralPath $cudaCrtSource -File |
            Copy-Item -Destination $cudaCrtDestination -Force

          $requiredFiles = @(
            (Join-Path $cudaBin "nvcc.exe"),
            (Join-Path $cudaRoot "include\cuda_runtime.h"),
            (Join-Path $cudaRoot "include\crt\host_config.h"),
            (Join-Path $cudaRoot "include\crt\host_defines.h"),
            (Join-Path $cudaRoot "include\cublas_v2.h"),
            (Join-Path $cudaRoot "lib\x64\cudart_static.lib"),
            (Join-Path $cudaRoot "lib\x64\cublas.lib"),
            (Join-Path $cudaRoot "lib\x64\cuda.lib")
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Required CUDA file was not installed: $requiredFile"
            }
          }
          $cubHeader = @(
            (Join-Path $cudaRoot "include\cub\cub.cuh"),
            (Join-Path $cudaRoot "include\cccl\cub\cub.cuh")
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $cubHeader) {
            throw "The CUDA Thrust/CUB headers were not installed."
          }

          "CUDA_PATH=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $cudaBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:CUDA_PATH = $cudaRoot
          $env:PATH = "$cudaBin;$env:PATH"
          "CUDA root: $cudaRoot" | Tee-Object -FilePath $installLog -Append
          & nvcc --version 2>&1 | Tee-Object -FilePath $installLog -Append
          if ($LASTEXITCODE -ne 0) { throw "nvcc --version failed." }

          # Compile, but do not run, a minimal CUDA translation unit before the
          # expensive CPU build. This validates NVCC, CUDA CRT headers and MSVC.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = (& $vswhere -latest -products * -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1).Trim()
          $devCommand = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          $cudaSmokeSource = Join-Path $env:RUNNER_TEMP "jarvis-cuda-toolchain-smoke.cu"
          $cudaSmokeObject = Join-Path $env:RUNNER_TEMP "jarvis-cuda-toolchain-smoke.obj"
          $cudaSmokeBatch = Join-Path $env:RUNNER_TEMP "jarvis-cuda-toolchain-smoke.cmd"
          [IO.File]::WriteAllText(
            $cudaSmokeSource,
            'extern "C" __global__ void jarvis_cuda_toolchain_smoke() {}',
            [Text.Encoding]::ASCII
          )
          [IO.File]::WriteAllLines(
            $cudaSmokeBatch,
            @(
              '@echo off',
              "call `"$devCommand`" -no_logo -arch=x64 -host_arch=x64 >nul",
              'if errorlevel 1 exit /b %errorlevel%',
              "`"$(Join-Path $cudaBin 'nvcc.exe')`" -allow-unsupported-compiler -arch=sm_75 -c `"$cudaSmokeSource`" -o `"$cudaSmokeObject`"",
              'exit /b %errorlevel%'
            ),
            [Text.Encoding]::ASCII
          )
          $cudaSmokeExitCode = 1
          try {
            & $cudaSmokeBatch 2>&1 |
              Tee-Object -FilePath $installLog -Append
            $cudaSmokeExitCode = $LASTEXITCODE
          } finally {
            Remove-Item -LiteralPath $cudaSmokeSource, $cudaSmokeObject, $cudaSmokeBatch `
              -Force -ErrorAction SilentlyContinue
          }
          if ($cudaSmokeExitCode -ne 0) {
            throw "CUDA compiler preflight failed with exit code $cudaSmokeExitCode."
          }
          "CUDA compiler preflight passed without executing GPU code." |
            Tee-Object -FilePath $installLog -Append

      - name: 安装项目依赖
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:BUILD_LOG_DIR "npm-deps-install.log"
          & npm.cmd run deps:install 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "npm run deps:install failed with exit code $LASTEXITCODE."
          }

      - name: 预检 Windows PowerShell 标准模块
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:BUILD_LOG_DIR "windows-powershell-preflight.log"
          $windowsPowerShell = (Get-Command powershell.exe -CommandType Application -ErrorAction Stop).Source
          "Workflow shell: pwsh $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))" |
            Tee-Object -FilePath $log
          "Resolved powershell.exe: $windowsPowerShell" | Tee-Object -FilePath $log -Append

          $preflightScriptPath = Join-Path $env:RUNNER_TEMP "jarvis-windows-powershell-preflight.ps1"
          $preflightScript = @'
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $OutputEncoding = [Text.Encoding]::UTF8
          Write-Output ("PowerShell executable: " + (Get-Process -Id $PID).Path)
          Write-Output ("PowerShell version: " + $PSVersionTable.PSVersion.ToString())
          Write-Output ("PowerShell edition: " + $PSVersionTable.PSEdition)
          Write-Output ("PSModulePath: " + $env:PSModulePath)
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) {
              throw "powershell.exe did not start Windows PowerShell 5.1."
          }
          Import-Module Microsoft.PowerShell.Utility -ErrorAction Stop
          $fileHashCommand = Get-Command Get-FileHash -ErrorAction Stop
          Write-Output ("Get-FileHash source: " + $fileHashCommand.Source)
          Write-Output "Windows PowerShell standard module preflight passed."
          exit 0
          '@
          [IO.File]::WriteAllText(
            $preflightScriptPath,
            $preflightScript,
            [Text.Encoding]::ASCII
          )

          $preflightExitCode = 1
          try {
            & $windowsPowerShell -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File $preflightScriptPath 2>&1 |
              Tee-Object -FilePath $log -Append
            $preflightExitCode = $LASTEXITCODE
          } finally {
            Remove-Item -LiteralPath $preflightScriptPath -Force -ErrorAction SilentlyContinue
          }
          if ($preflightExitCode -ne 0) {
            throw "Windows PowerShell module preflight failed with exit code $preflightExitCode."
          }

      - name: 预检 Node 到 Windows PowerShell 环境传递
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module Microsoft.PowerShell.Management -ErrorAction Stop
          Import-Module Microsoft.PowerShell.Utility -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_POWERSHELL_MODULE_PATH)) {
            throw "WINDOWS_POWERSHELL_MODULE_PATH was not initialized."
          }
          $env:PSModulePath = $env:WINDOWS_POWERSHELL_MODULE_PATH
          $log = Join-Path $env:BUILD_LOG_DIR "node-powershell-preflight.log"
          $nodeScriptPath = Join-Path $env:RUNNER_TEMP "jarvis-node-powershell-preflight.js"
          $powerShellScriptPath = Join-Path $env:RUNNER_TEMP "jarvis-node-child-preflight.ps1"

          $powerShellScript = @'
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $OutputEncoding = [Text.Encoding]::UTF8
          Write-Output ("Child PowerShell executable: " + (Get-Process -Id $PID).Path)
          Write-Output ("Child PowerShell version: " + $PSVersionTable.PSVersion.ToString())
          Write-Output ("Child PSModulePath: " + $env:PSModulePath)
          Import-Module Microsoft.PowerShell.Utility -ErrorAction Stop
          $fileHashCommand = Get-Command Get-FileHash -ErrorAction Stop
          Write-Output ("Child Get-FileHash source: " + $fileHashCommand.Source)
          Write-Output "Node child_process Windows PowerShell preflight passed."
          exit 0
          '@

          $nodeScript = @'
          "use strict";

          const { spawnSync } = require("node:child_process");

          const powerShellScriptPath = process.argv[2];
          const modulePathKeys = Object.keys(process.env)
            .filter((key) => key.toLowerCase() === "psmodulepath")
            .sort();

          console.log(`Node executable: ${process.execPath}`);
          console.log(`PSModulePath key count in Node: ${modulePathKeys.length}`);
          for (const key of modulePathKeys) {
            console.log(`${key}=${JSON.stringify(process.env[key])}`);
          }
          if (modulePathKeys.length === 0) {
            console.error("Node did not inherit any PSModulePath environment variable.");
            process.exit(1);
          }

          const child = spawnSync(
            "powershell.exe",
            [
              "-NoLogo",
              "-NoProfile",
              "-ExecutionPolicy",
              "Bypass",
              "-File",
              powerShellScriptPath,
            ],
            {
              env: process.env,
              encoding: "utf8",
              windowsHide: true,
            },
          );

          if (child.stdout) process.stdout.write(child.stdout);
          if (child.stderr) process.stderr.write(child.stderr);
          if (child.error) {
            console.error(`Node failed to start powershell.exe: ${child.error.message}`);
            process.exit(1);
          }
          if (child.status !== 0) {
            console.error(
              `Node-spawned powershell.exe failed with ${
                child.signal ? `signal ${child.signal}` : `exit code ${child.status}`
              }.`,
            );
            process.exit(child.status === null ? 1 : child.status);
          }
          console.log("Node environment transfer preflight passed.");
          '@

          [IO.File]::WriteAllText(
            $powerShellScriptPath,
            $powerShellScript,
            [Text.Encoding]::ASCII
          )
          [IO.File]::WriteAllText(
            $nodeScriptPath,
            $nodeScript,
            [Text.Encoding]::ASCII
          )

          $nodePreflightExitCode = 1
          try {
            & node $nodeScriptPath $powerShellScriptPath 2>&1 |
              Tee-Object -FilePath $log
            $nodePreflightExitCode = $LASTEXITCODE
          } finally {
            Remove-Item -LiteralPath $nodeScriptPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $powerShellScriptPath -Force -ErrorAction SilentlyContinue
          }
          if ($nodePreflightExitCode -ne 0) {
            throw "Node to Windows PowerShell environment preflight failed with exit code $nodePreflightExitCode."
          }

      - name: 构建 CPU/CUDA Worker、Python 后端和 NSIS 安装包
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module Microsoft.PowerShell.Management -ErrorAction Stop
          Import-Module Microsoft.PowerShell.Utility -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_POWERSHELL_MODULE_PATH)) {
            throw "WINDOWS_POWERSHELL_MODULE_PATH was not initialized."
          }
          $env:PSModulePath = $env:WINDOWS_POWERSHELL_MODULE_PATH
          $log = Join-Path $env:BUILD_LOG_DIR "npm-build.log"
          & npm.cmd run build 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "npm run build failed with exit code $LASTEXITCODE."
          }

      - name: 验证安装包并生成 SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distRoot = Join-Path $env:GITHUB_WORKSPACE "desktop\dist"
          $packagedRuntimeRoot = Join-Path $distRoot "win-unpacked\resources\backend\runtime"
          $packagedLicenseRoot = Join-Path $distRoot "win-unpacked\resources\licenses"
          $requiredPackagedFiles = @(
            (Join-Path $packagedRuntimeRoot "jarvis-launcher.exe"),
            (Join-Path $packagedRuntimeRoot "jarvis-native-worker-cpu.exe"),
            (Join-Path $packagedRuntimeRoot "jarvis-native-worker-cuda.exe"),
            (Join-Path $packagedRuntimeRoot "runtime-manifest.json"),
            (Join-Path $packagedRuntimeRoot "default_ref_audio.wav"),
            (Join-Path $packagedLicenseRoot "AI-Jarvis-LICENSE.txt"),
            (Join-Path $packagedLicenseRoot "THIRD_PARTY_NOTICES.md")
          )
          foreach ($requiredPackagedFile in $requiredPackagedFiles) {
            if (-not (Test-Path -LiteralPath $requiredPackagedFile -PathType Leaf)) {
              throw "Packaged runtime file is missing: $requiredPackagedFile"
            }
          }
          foreach ($cudaRuntimePattern in @("cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll")) {
            if (-not (Get-ChildItem -LiteralPath $packagedRuntimeRoot `
                -Filter $cudaRuntimePattern -File -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Packaged CUDA dependency is missing: $cudaRuntimePattern"
            }
          }
          $runtimeManifest = Get-Content -LiteralPath `
            (Join-Path $packagedRuntimeRoot "runtime-manifest.json") -Raw -Encoding UTF8 |
            ConvertFrom-Json
          if ($runtimeManifest.architecture -ne "x64" -or
              $runtimeManifest.inference -notcontains "cpu" -or
              $runtimeManifest.inference -notcontains "cuda") {
            throw "Packaged runtime manifest does not declare x64 CPU and CUDA inference."
          }
          Write-Host "Packaged runtime, CUDA DLLs and legal notices are present."

          $installers = @(Get-ChildItem -LiteralPath $distRoot `
            -Filter "AI-Jarvis-Setup-*-x64.exe" -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            throw "No installer matched desktop/dist/AI-Jarvis-Setup-*-x64.exe."
          }

          $checksumPath = Join-Path $distRoot "SHA256SUMS.txt"
          $checksumLines = foreach ($installer in $installers) {
            $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $sizeMiB = [Math]::Round($installer.Length / 1MB, 2)
            Write-Host "Installer: $($installer.Name)"
            Write-Host "Size: $($installer.Length) bytes ($sizeMiB MiB)"
            Write-Host "SHA-256: $hash"
            "$hash *$($installer.Name)"
          }
          [IO.File]::WriteAllLines($checksumPath, $checksumLines, [Text.UTF8Encoding]::new($false))
          Write-Host "Checksum file: $checksumPath"

      - name: 上传 Windows 安装包 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ env.ARTIFACT_BRANCH }}-${{ github.run_number }}
          path: |
            desktop/dist/AI-Jarvis-Setup-*-x64.exe
            desktop/dist/SHA256SUMS.txt
            ${{ runner.temp }}/jarvis-build-logs/*.log
          retention-days: 7
          if-no-files-found: error

      - name: 收集失败诊断日志
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          if ([string]::IsNullOrWhiteSpace($env:BUILD_LOG_DIR)) {
            $env:BUILD_LOG_DIR = Join-Path $env:RUNNER_TEMP "jarvis-build-logs"
          }
          New-Item -ItemType Directory -Path $env:BUILD_LOG_DIR -Force | Out-Null

          $diagnosticFiles = @(
            @{
              Source = "$env:GITHUB_WORKSPACE\build\release\native-cpu\CMakeFiles\CMakeConfigureLog.yaml"
              Name = "native-cpu-CMakeConfigureLog.yaml"
            },
            @{
              Source = "$env:GITHUB_WORKSPACE\build\release\native-cpu\CMakeFiles\CMakeError.log"
              Name = "native-cpu-CMakeError.log"
            },
            @{
              Source = "$env:GITHUB_WORKSPACE\build\release\native-cpu\CMakeFiles\CMakeOutput.log"
              Name = "native-cpu-CMakeOutput.log"
            },
            @{
              Source = "$env:GITHUB_WORKSPACE\build\release\native-cuda-13.3\CMakeFiles\CMakeConfigureLog.yaml"
              Name = "native-cuda-CMakeConfigureLog.yaml"
            },
            @{
              Source = "$env:GITHUB_WORKSPACE\build\release\native-cuda-13.3\CMakeFiles\CMakeError.log"
              Name = "native-cuda-CMakeError.log"
            },
            @{
              Source = "$env:GITHUB_WORKSPACE\build\release\native-cuda-13.3\CMakeFiles\CMakeOutput.log"
              Name = "native-cuda-CMakeOutput.log"
            }
          )
          foreach ($file in $diagnosticFiles) {
            if (Test-Path -LiteralPath $file.Source -PathType Leaf) {
              $destination = Join-Path $env:BUILD_LOG_DIR $file.Name
              Copy-Item -LiteralPath $file.Source -Destination $destination -Force
            }
          }

          $npmLogRoot = Join-Path $env:LOCALAPPDATA "npm-cache\_logs"
          if (Test-Path -LiteralPath $npmLogRoot -PathType Container) {
            Get-ChildItem -LiteralPath $npmLogRoot -Filter "*.log" -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination $env:BUILD_LOG_DIR -Force
          }
          exit 0

      - name: 上传失败日志 Artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ env.ARTIFACT_BRANCH }}-${{ github.run_number }}-failure-logs
          path: ${{ runner.temp }}/jarvis-build-logs/**/*
          retention-days: 7
          if-no-files-found: ignore
