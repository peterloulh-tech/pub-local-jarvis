name: 验证 Windows 代码与 Native

on:
  workflow_dispatch:
  push:
    branches:
      - feature-forced-game-mode

permissions:
  contents: read

jobs:
  validate-windows:
    name: JavaScript、Python 与 Native 验证
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      NODE_VERSION: 22.22.3
      PYTHON_VERSION: '3.12'
      CUDA_VERSION: '13.1.1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备验证目录
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $logRoot = Join-Path $env:RUNNER_TEMP "jarvis-validation-logs"
          $cpuBuildRoot = Join-Path $env:RUNNER_TEMP "jarvis-native-cpu"
          $cudaBuildRoot = Join-Path $env:RUNNER_TEMP "jarvis-native-cuda"
          $upstreamRoot = Join-Path $env:RUNNER_TEMP "jarvis-patched-upstream"
          New-Item -ItemType Directory -Path $logRoot -Force | Out-Null
          "VALIDATION_LOG_DIR=$logRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NATIVE_CPU_BUILD_DIR=$cpuBuildRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NATIVE_CUDA_BUILD_DIR=$cudaBuildRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "JARVIS_UPSTREAM_ROOT=$upstreamRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $artifactBranch = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
          "ARTIFACT_BRANCH=$artifactBranch" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 配置 Node.js 22.22.3
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 配置 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 定位 Visual Studio 2022 并输出工具版本
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:VALIDATION_LOG_DIR "tool-versions.log"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found: $vswhere"
          }
          $installationPath = (& $vswhere -latest -products * -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1).Trim()
          if (-not $installationPath) {
            throw "Visual Studio 2022 with the x64 C++ toolchain was not found."
          }
          $devCommand = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path -LiteralPath $devCommand -PathType Leaf)) {
            throw "VsDevCmd.bat was not found: $devCommand"
          }

          "Visual Studio installation: $installationPath" | Tee-Object -FilePath $log
          & cmd.exe /d /s /c "`"$devCommand`" -no_logo -arch=x64 -host_arch=x64 >nul && cl.exe 2>&1" |
            Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "cl.exe version check failed." }
          & node --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "node --version failed." }
          & npm.cmd --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "npm --version failed." }
          & python --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "python --version failed." }
          & python -m pip --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "pip --version failed." }
          & cmake --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "cmake --version failed." }
          & ninja --version 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "ninja --version failed." }

      - name: 安装 Node 项目依赖
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:VALIDATION_LOG_DIR "npm-install.log"
          & npm.cmd run deps:install 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "npm run deps:install failed with exit code $LASTEXITCODE."
          }

      - name: 运行完整 JavaScript 测试
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:VALIDATION_LOG_DIR "javascript-tests.log"
          & npm.cmd test 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "npm test failed with exit code $LASTEXITCODE."
          }

      - name: 安装 Python 运行和测试依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:VALIDATION_LOG_DIR "python-install.log"
          & python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }
          & python -m pip install ".[test]" ruff 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) {
            throw "Python dependency installation failed with exit code $LASTEXITCODE."
          }
          & python -m pip check 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "pip check failed." }

      - name: 运行 Python 测试
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:VALIDATION_LOG_DIR "python-tests.log"
          & python -m pytest 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "pytest failed with exit code $LASTEXITCODE."
          }

      - name: 运行 Python 静态检查
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:VALIDATION_LOG_DIR "python-ruff.log"
          & python -m ruff check src tests 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "ruff check failed with exit code $LASTEXITCODE."
          }

      - name: 准备固定并已打补丁的 Native 上游源码
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:VALIDATION_LOG_DIR "native-upstream.log"
          $vendorRoot = Join-Path $env:GITHUB_WORKSPACE "third_party\runtime\vendor"
          $patchPath = Join-Path $env:GITHUB_WORKSPACE `
            "third_party\runtime\patches\0001-text-input-runtime.patch"
          if (-not (Test-Path -LiteralPath $patchPath -PathType Leaf)) {
            throw "Pinned runtime patch was not found: $patchPath"
          }
          if (Test-Path -LiteralPath $env:JARVIS_UPSTREAM_ROOT) {
            Remove-Item -LiteralPath $env:JARVIS_UPSTREAM_ROOT -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:JARVIS_UPSTREAM_ROOT -Force | Out-Null
          Get-ChildItem -LiteralPath $vendorRoot -Force |
            Copy-Item -Destination $env:JARVIS_UPSTREAM_ROOT -Recurse -Force

          & git.exe -C $env:JARVIS_UPSTREAM_ROOT init --quiet 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "git init failed for the pinned upstream." }
          & git.exe -C $env:JARVIS_UPSTREAM_ROOT config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "git config failed for the pinned upstream." }
          & git.exe -C $env:JARVIS_UPSTREAM_ROOT add --all
          if ($LASTEXITCODE -ne 0) { throw "git add failed for the pinned upstream." }
          & git.exe -C $env:JARVIS_UPSTREAM_ROOT `
            -c user.name="AI Jarvis Validation" `
            -c user.email="validation@aijarvis.invalid" `
            commit --quiet -m "Pinned upstream" 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "git commit failed for the pinned upstream." }
          & git.exe -C $env:JARVIS_UPSTREAM_ROOT apply --check `
            --ignore-space-change --ignore-whitespace $patchPath 2>&1 |
            Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "Pinned runtime patch check failed." }
          & git.exe -C $env:JARVIS_UPSTREAM_ROOT apply `
            --ignore-space-change --ignore-whitespace $patchPath 2>&1 |
            Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "Pinned runtime patch apply failed." }
          "Patched upstream: $env:JARVIS_UPSTREAM_ROOT" |
            Tee-Object -FilePath $log -Append

      - name: 配置并编译 CPU Native 正式目标和测试目标
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:VALIDATION_LOG_DIR "native-cpu-build.log"
          $arguments = @(
            "-S", $env:GITHUB_WORKSPACE,
            "-B", $env:NATIVE_CPU_BUILD_DIR,
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DJARVIS_ENABLE_STUB_RUNTIME=OFF",
            "-DJARVIS_RUNTIME_ENABLE_UPSTREAM=ON",
            "-DJARVIS_RUNTIME_UPSTREAM_SOURCE_DIR=$env:JARVIS_UPSTREAM_ROOT",
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded",
            "-DBUILD_SHARED_LIBS=OFF",
            "-DBUILD_TESTING=ON",
            "-DGGML_CUDA=FALSE",
            "-DGGML_CCACHE=OFF",
            "-DGGML_OPENMP=OFF",
            "-DLLAMA_OPENSSL=OFF",
            "-DLLAMA_BUILD_TESTS=OFF",
            "-DLLAMA_BUILD_EXAMPLES=OFF",
            "-DLLAMA_BUILD_SERVER=OFF",
            "-DLLAMA_BUILD_APP=OFF",
            "-DLLAMA_BUILD_COMMON=ON",
            "-DLLAMA_BUILD_TOOLS=ON"
          )
          & cmake.exe @arguments 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "CPU Native CMake configure failed with exit code $LASTEXITCODE."
          }
          & cmake.exe --build $env:NATIVE_CPU_BUILD_DIR --config Release `
            --target jarvis-native-tests jarvis-native-worker --parallel 2>&1 |
            Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) {
            throw "CPU Native build failed with exit code $LASTEXITCODE."
          }

      - name: 运行 Native C++ 测试
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:VALIDATION_LOG_DIR "native-tests.log"
          & ctest.exe --test-dir $env:NATIVE_CPU_BUILD_DIR --build-config Release `
            --output-on-failure -R '^jarvis-native-tests$' 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "Native C++ tests failed with exit code $LASTEXITCODE."
          }

      - name: 安装完整 CUDA Toolkit 13.1.1
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: local

      - name: 验证 CUDA 工具链
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:VALIDATION_LOG_DIR "cuda-toolchain.log"
          if ([string]::IsNullOrWhiteSpace($env:CUDA_PATH)) {
            throw "CUDA_PATH was not initialized by the CUDA Toolkit action."
          }
          $nvcc = Join-Path $env:CUDA_PATH "bin\nvcc.exe"
          if (-not (Test-Path -LiteralPath $nvcc -PathType Leaf)) {
            throw "nvcc.exe was not found: $nvcc"
          }
          & $nvcc --version 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "nvcc --version failed." }

      - name: 配置并编译 CUDA Native 正式目标
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:VALIDATION_LOG_DIR "native-cuda-build.log"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = (& $vswhere -latest -products * -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1).Trim()
          $devCommand = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          $protectedNames = @(
            "PSModulePath", "HOME", "USERPROFILE", "TEMP", "TMP", "SystemRoot", "ComSpec"
          )
          $protectedValues = @{}
          foreach ($name in $protectedNames) {
            $protectedValues[$name] = [Environment]::GetEnvironmentVariable($name, "Process")
          }
          $environmentLines = & cmd.exe /d /s /c `
            "`"$devCommand`" -no_logo -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to initialize the Visual Studio x64 environment."
          }
          foreach ($line in $environmentLines) {
            $separator = $line.IndexOf('=')
            if ($separator -le 0) { continue }
            $name = $line.Substring(0, $separator)
            if ($protectedNames -contains $name) { continue }
            [Environment]::SetEnvironmentVariable(
              $name,
              $line.Substring($separator + 1),
              "Process"
            )
          }
          foreach ($name in $protectedNames) {
            [Environment]::SetEnvironmentVariable($name, $protectedValues[$name], "Process")
          }
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $cl = (Get-Command cl.exe -CommandType Application -ErrorAction Stop).Source
          "CUDA host compiler: $cl" | Tee-Object -FilePath $log

          $arguments = @(
            "-S", $env:GITHUB_WORKSPACE,
            "-B", $env:NATIVE_CUDA_BUILD_DIR,
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_C_COMPILER=cl.exe",
            "-DCMAKE_CXX_COMPILER=cl.exe",
            "-DCMAKE_CUDA_COMPILER=$(Join-Path $env:CUDA_PATH 'bin\nvcc.exe')",
            "-DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler",
            "-DCMAKE_CUDA_ARCHITECTURES=75;80;86;89;120",
            "-DCUDAToolkit_ROOT=$env:CUDA_PATH",
            "-DJARVIS_ENABLE_STUB_RUNTIME=OFF",
            "-DJARVIS_RUNTIME_ENABLE_UPSTREAM=ON",
            "-DJARVIS_RUNTIME_UPSTREAM_SOURCE_DIR=$env:JARVIS_UPSTREAM_ROOT",
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded",
            "-DBUILD_SHARED_LIBS=OFF",
            "-DBUILD_TESTING=OFF",
            "-DGGML_CUDA=TRUE",
            "-DGGML_CUDA_NCCL=OFF",
            "-DGGML_CCACHE=OFF",
            "-DGGML_OPENMP=OFF",
            "-DLLAMA_OPENSSL=OFF",
            "-DLLAMA_BUILD_TESTS=OFF",
            "-DLLAMA_BUILD_EXAMPLES=OFF",
            "-DLLAMA_BUILD_SERVER=OFF",
            "-DLLAMA_BUILD_APP=OFF",
            "-DLLAMA_BUILD_COMMON=ON",
            "-DLLAMA_BUILD_TOOLS=ON"
          )
          & cmake.exe @arguments 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) {
            throw "CUDA Native CMake configure failed with exit code $LASTEXITCODE."
          }
          & cmake.exe --build $env:NATIVE_CUDA_BUILD_DIR `
            --target jarvis-native-worker --parallel 4 2>&1 |
            Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) {
            throw "CUDA Native build failed with exit code $LASTEXITCODE."
          }

      - name: 收集失败诊断日志
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          if ([string]::IsNullOrWhiteSpace($env:VALIDATION_LOG_DIR)) {
            $env:VALIDATION_LOG_DIR = Join-Path $env:RUNNER_TEMP "jarvis-validation-logs"
          }
          New-Item -ItemType Directory -Path $env:VALIDATION_LOG_DIR -Force | Out-Null
          foreach ($build in @(
            @{ Root = $env:NATIVE_CPU_BUILD_DIR; Prefix = "native-cpu" },
            @{ Root = $env:NATIVE_CUDA_BUILD_DIR; Prefix = "native-cuda" }
          )) {
            if ([string]::IsNullOrWhiteSpace($build.Root)) { continue }
            foreach ($name in @("CMakeConfigureLog.yaml", "CMakeError.log", "CMakeOutput.log")) {
              $source = Join-Path $build.Root "CMakeFiles\$name"
              if (Test-Path -LiteralPath $source -PathType Leaf) {
                Copy-Item -LiteralPath $source -Destination `
                  (Join-Path $env:VALIDATION_LOG_DIR "$($build.Prefix)-$name") -Force
              }
            }
          }
          $npmLogRoot = Join-Path $env:LOCALAPPDATA "npm-cache\_logs"
          if (Test-Path -LiteralPath $npmLogRoot -PathType Container) {
            Get-ChildItem -LiteralPath $npmLogRoot -Filter "*.log" -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination $env:VALIDATION_LOG_DIR -Force
          }
          exit 0

      - name: 上传 Windows 验证日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-${{ env.ARTIFACT_BRANCH }}-${{ github.run_number }}
          path: ${{ runner.temp }}/jarvis-validation-logs/**/*
          retention-days: 7
          if-no-files-found: error
